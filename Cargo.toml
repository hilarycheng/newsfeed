[package]
name = "news-feeder"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
chrono = "0.4"
encoding_rs = "0.8"
html-escape = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "system-proxy"] }
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
