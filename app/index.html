<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#2458d5"><meta name="apple-mobile-web-app-title" content="News Feed"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><title>News Feed</title><meta name="description" content="最近三日科技、國際、香港與單機遊戲新聞。"><link rel="icon" href="{{favicon}}"><style>{{css}}</style></head><body><main><header><div class="brand"><span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></span><h1>News Feed</h1></div><button id="install-app" type="button" hidden>安裝 App</button></header><div class="edition"><span id="edition-date">{{edition_date}}</span><span id="edition-count">{{count}} 則</span></div><p class="updated">上次整理 <span id="updated-at">{{updated_at}}</span> · 香港時間</p><div class="volume"><strong id="volume-count">近三日 · 72 小時</strong><span id="volume-target">目標三日 200–300+ 則</span></div><p id="shortfall" class="shortfall" hidden>近三日核實的合適新聞少於 200 則；不以重複、舊聞或不相關內容湊數。</p><aside id="stale" class="notice" hidden>本期超過 36 小時未更新，以下保留上次成功整理的內容。</aside><aside id="offline-status" class="notice" role="status" hidden>離線中 · 顯示已儲存內容；圖片及原文連結需要網絡。</aside>{{note}}<fieldset class="feed-filters"><legend>分類篩選</legend><div class="filter-options"><button type="button" data-feed-filter="all" aria-pressed="true" aria-controls="feed" disabled>All</button><button type="button" data-feed-filter="tech" aria-pressed="false" aria-controls="feed" disabled>Tech</button><button type="button" data-feed-filter="world" aria-pressed="false" aria-controls="feed" disabled>World</button><button type="button" data-feed-filter="hong-kong" aria-pressed="false" aria-controls="feed" disabled>Hong Kong</button><button type="button" data-feed-filter="newsletter" aria-pressed="false" aria-controls="feed" disabled>Newsletters</button><button type="button" data-feed-filter="steam" aria-pressed="false" aria-controls="feed" disabled>Steam</button><button type="button" data-feed-filter="cve" aria-pressed="false" aria-controls="feed" disabled>CVE</button></div></fieldset><fieldset class="feed-filters"><legend>語言篩選</legend><div class="filter-options"><button type="button" data-language-filter="all" aria-pressed="true" aria-controls="feed" disabled>全部語言</button><button type="button" data-language-filter="en" aria-pressed="false" aria-controls="feed" disabled>English</button><button type="button" data-language-filter="zh" aria-pressed="false" aria-controls="feed" disabled>中文</button></div></fieldset><p class="filter-status" id="filter-status" role="status" aria-live="polite" aria-atomic="true"></p><section class="feed" id="feed" aria-label="新聞內容"><noscript>{{fallback}}<p>啟用 JavaScript 後可篩選分類及繼續載入其餘新聞。</p></noscript></section><div id="more" class="load-more" hidden><button id="load-more" type="button" aria-controls="feed">載入更多</button></div><div id="end" class="feed-end" hidden><span aria-hidden="true"></span><b id="end-count"></b><span aria-hidden="true"></span></div>{{failures}}<div class="footnote">標題與短摘錄直接取自來源，未經 AI 改寫，完整內容請閱讀原文。<br>新聞與優惠動態時間均以香港時間顯示；價格核對時間另列。</div>{{license}}</main><script type="application/json" id="feed-data">{{payload}}</script><script>{{reader}}</script></body></html>
